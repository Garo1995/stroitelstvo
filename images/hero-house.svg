<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="Строящийся дом и башенный кран">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#f5b400" stop-opacity=".32"/>
      <stop offset="1" stop-color="#f5b400" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a525e"/>
      <stop offset="1" stop-color="#242930"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5b400"/>
      <stop offset="1" stop-color="#c98a00"/>
    </linearGradient>
  </defs>
  <style>
    .hook { animation: sway 4s ease-in-out infinite alternate; transform-origin: 424px 96px; }
    .trolley { animation: move 6s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    @keyframes move { from { transform: translateX(-34px); } to { transform: translateX(26px); } }
    @media (prefers-reduced-motion: reduce) { .hook, .trolley { animation: none; } }
  </style>

  <ellipse cx="320" cy="240" rx="310" ry="195" fill="url(#glow)"/>
  <circle cx="320" cy="225" r="190" fill="none" stroke="#f5b400" stroke-opacity=".18" stroke-dasharray="3 9" stroke-width="2"/>
  <ellipse cx="320" cy="388" rx="290" ry="14" fill="#000" opacity=".5"/>

  <!-- башенный кран -->
  <g fill="none" stroke="#f5b400" stroke-width="3" stroke-linejoin="round">
    <path d="M500 388V70M530 388V70M500 388l30-40M530 388l-30-40M500 348l30-40M530 348l-30-40M500 308l30-40M530 308l-30-40M500 268l30-40M530 268l-30-40M500 228l30-40M530 228l-30-40M500 188l30-40M530 188l-30-40M500 148l30-40M530 148l-30-40M500 108l30-40"/>
    <path d="M515 70L330 70M515 70L580 70M515 30V70M515 30L350 70M515 30L585 70"/>
    <path d="M330 70h250v14H330z" fill="#15181d"/>
  </g>
  <rect x="548" y="70" width="34" height="26" fill="#4a525e"/>
  <g class="trolley">
    <rect x="410" y="84" width="28" height="9" fill="#f5b400"/>
    <g class="hook">
      <path d="M424 93V170" stroke="#aab2bd" stroke-width="2"/>
      <path d="M414 170h20v14h-20z" fill="#f5b400"/>
      <path d="M404 184h40v10h-40z" fill="#4a525e"/>
    </g>
  </g>

  <!-- дом -->
  <path d="M70 388V220h330v168z" fill="url(#wall)"/>
  <path d="M52 224L235 120l183 104z" fill="url(#roof)"/>
  <path d="M52 224L235 120l183 104" fill="none" stroke="#15181d" stroke-opacity=".35" stroke-width="3"/>
  <rect x="110" y="256" width="62" height="54" rx="3" fill="#8fb4d9" fill-opacity=".85"/>
  <path d="M141 256v54M110 283h62" stroke="#15181d" stroke-opacity=".5" stroke-width="2"/>
  <rect x="300" y="256" width="62" height="54" rx="3" fill="#8fb4d9" fill-opacity=".85"/>
  <path d="M331 256v54M300 283h62" stroke="#15181d" stroke-opacity=".5" stroke-width="2"/>
  <rect x="206" y="296" width="56" height="92" rx="3" fill="#15181d"/>
  <circle cx="252" cy="344" r="3" fill="#f5b400"/>
  <circle cx="235" cy="196" r="14" fill="#15181d" fill-opacity=".35"/>
  <circle cx="235" cy="196" r="8" fill="#8fb4d9" fill-opacity=".85"/>

  <!-- поддоны и кирпичи -->
  <g>
    <rect x="420" y="364" width="64" height="24" fill="#c0643a"/>
    <path d="M420 376h64M436 364v12M452 376v12M468 364v12" stroke="#15181d" stroke-opacity=".35" stroke-width="2"/>
    <rect x="30" y="368" width="34" height="20" fill="#aab2bd"/>
    <path d="M30 378h34" stroke="#15181d" stroke-opacity=".3" stroke-width="2"/>
  </g>
  <rect x="0" y="388" width="640" height="3" fill="#f5b400" opacity=".4"/>
</svg>
