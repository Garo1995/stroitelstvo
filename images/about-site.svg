<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-label="Строительная площадка с каркасом дома">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f242c"/>
      <stop offset="1" stop-color="#0f1114"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="62%" r="55%">
      <stop offset="0" stop-color="#f5b400" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f5b400" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="560" height="480" rx="28" fill="url(#bg)"/>
  <rect width="560" height="480" rx="28" fill="url(#glow)"/>

  <!-- сетка чертежа -->
  <g stroke="#fff" stroke-opacity=".05" stroke-width="1">
    <path d="M40 0V480M80 0V480M120 0V480M160 0V480M200 0V480M240 0V480M280 0V480M320 0V480M360 0V480M400 0V480M440 0V480M480 0V480M520 0V480"/>
    <path d="M0 40H560M0 80H560M0 120H560M0 160H560M0 200H560M0 240H560M0 280H560M0 320H560M0 360H560M0 400H560M0 440H560"/>
  </g>

  <!-- каска -->
  <g transform="translate(60 52)" fill="none" stroke="#f5b400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 44a28 28 0 0 1 56 0z" fill="#f5b400" fill-opacity=".25"/>
    <path d="M0 44h68M34 16v28"/>
  </g>
  <!-- линейка/размеры -->
  <g stroke="#f5b400" stroke-width="2" opacity=".8" fill="none">
    <path d="M300 74h200M300 66v16M500 66v16"/>
    <path d="M520 130v200M512 130h16M512 330h16"/>
  </g>
  <text x="400" y="62" fill="#f5b400" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" opacity=".9">12 000</text>

  <!-- каркас дома -->
  <path d="M110 410V240l170-100 170 100v170" fill="none" stroke="#aab2bd" stroke-width="5" stroke-linejoin="round"/>
  <g stroke="#aab2bd" stroke-width="4" stroke-linecap="round">
    <path d="M170 410V250M230 410V215M290 410V190M350 410V215M410 410V250M110 330h340M110 370h340"/>
  </g>
  <path d="M110 240h340" stroke="#f5b400" stroke-width="5"/>
  <path d="M110 410h340" stroke="#f5b400" stroke-width="6"/>
  <path d="M170 330l60 40M230 330l60 40M290 330l60 40M350 330l60 40" stroke="#f5b400" stroke-opacity=".6" stroke-width="3"/>

  <rect x="0" y="410" width="560" height="70" rx="0" fill="#14171c"/>
  <path d="M0 410H560V452a28 28 0 0 1-28 28H28A28 28 0 0 1 0 452Z" fill="#14171c"/>
  <path d="M24 448H536" stroke="#f5b400" stroke-width="3" stroke-dasharray="26 18" opacity=".45"/>
